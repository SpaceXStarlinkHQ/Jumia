[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
# Install pnpm globally then use its absolute path so the same shell can find it
cmds = ["npm install -g pnpm@10.26.1 --ignore-scripts && $(npm config get prefix)/bin/pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["node artifacts/api-server/build.mjs"]

[start]
cmd = "node artifacts/api-server/dist/index.mjs"
